apply plugin: 'application'

application {
    mainClass = 'co.icesi.buscaminas.client.MainClient'
}

jar {
    manifest {
        attributes('Main-Class': 'co.icesi.buscaminas.client.MainClient')
    }
}

run {
    // El menu lee de consola con Scanner: ./gradlew :client:run -q --console=plain --args="localhost 12345"
    standardInput = System.in
}
